name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  detect-project:
    name: Detect Project Type
    runs-on: ubuntu-latest
    outputs:
      has_gradle: ${{ steps.detect.outputs.has_gradle }}
      has_maven: ${{ steps.detect.outputs.has_maven }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_dotnet: ${{ steps.detect.outputs.has_dotnet }}
      has_global_json: ${{ steps.detect.outputs.has_global_json }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect files
        id: detect
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          fi

          for profile in maven node python go rust dotnet global_json; do
            echo "has_${profile}=false" >> "$GITHUB_OUTPUT"
          done
          if [ -f "pom.xml" ]; then echo "has_maven=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "pyproject.toml" ] || [ -f "pytest.ini" ] || [ -f "setup.py" ] || [ -f "setup.cfg" ] || [ -f "requirements.txt" ] || [ -f "tox.ini" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "go.mod" ]; then echo "has_go=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f "Cargo.toml" ]; then echo "has_rust=true" >> "$GITHUB_OUTPUT"; fi
          if find . -maxdepth 1 -type f \( -name '*.sln' -o -name '*.csproj' -o -name '*.fsproj' -o -name '*.vbproj' \) | grep -q .; then
            echo "has_dotnet=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "global.json" ]; then echo "has_global_json=true" >> "$GITHUB_OUTPUT"; fi

  harness-governance:
    name: Harness Governance
    runs-on: ubuntu-latest
    needs: detect-project
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Health check
        run: bash scripts/health-check.sh
      - name: Memory governance check
        run: bash scripts/validate-memory.sh
      - name: Drift check
        run: bash scripts/scan-drift.sh
      - name: CLI smoke test
        run: bash scripts/smoke-test.sh

  harness-cross-platform:
    name: Harness Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run harness unit tests
        run: npm test
      - name: Run L5 soak simulation
        run: npm run test:soak
      - name: Run Unix smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke-test.sh
      - name: Run Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-test.ps1

  gradle-ci:
    name: Gradle CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_gradle == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run tests & coverage
        run: |
          ./gradlew test
          if grep -q "jacoco" build.gradle* 2>/dev/null; then
            ./gradlew jacocoTestCoverageVerification
          fi
      - name: Build
        run: ./gradlew build -x test

  node-ci:
    name: Node CI (npm)
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_node == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests and enforce coverage when configured
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.coverage ? 0 : 1)"; then
            npm run coverage
          else
            npm run test --if-present
          fi
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present

  maven-ci:
    name: Maven CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_maven == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw test
          else
            mvn test
          fi
      - name: Build
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi

  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_python == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          elif [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "setup.cfg" ]; then
            python -m pip install .
          fi
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest

  go-ci:
    name: Go CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_go == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_rust == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Run tests
        run: cargo test --all-targets

  dotnet-ci:
    name: .NET CI
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_dotnet == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET from global.json
        if: ${{ needs.detect-project.outputs.has_global_json == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Set up latest stable .NET
        if: ${{ needs.detect-project.outputs.has_global_json != 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: latest
      - name: Run tests
        run: dotnet test
