name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  detect-project:
    name: Detect Project Type
    runs-on: ubuntu-latest
    outputs:
      has_java: ${{ steps.detect.outputs.has_java }}
      has_node: ${{ steps.detect.outputs.has_node }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect files
        id: detect
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  harness-governance:
    name: Harness Governance
    runs-on: ubuntu-latest
    needs: detect-project
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Health check
        run: bash scripts/health-check.sh
      - name: Memory governance check
        run: bash scripts/validate-memory.sh
      - name: Drift check
        run: bash scripts/scan-drift.sh
      - name: CLI smoke test
        run: bash scripts/smoke-test.sh

  harness-cross-platform:
    name: Harness Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run harness unit tests
        run: npm test
      - name: Run L5 soak simulation
        run: npm run test:soak
      - name: Run Unix smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke-test.sh
      - name: Run Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-test.ps1

  java-ci:
    name: Java CI (Gradle)
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_java == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run tests & coverage
        run: |
          ./gradlew test
          if grep -q "jacoco" build.gradle* 2>/dev/null; then
            ./gradlew jacocoTestCoverageVerification
          fi
      - name: Build
        run: ./gradlew build -x test

  node-ci:
    name: Node CI (npm)
    runs-on: ubuntu-latest
    needs: detect-project
    if: ${{ needs.detect-project.outputs.has_node == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
