name: Security Scan

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-project:
    name: Detect Project Type
    runs-on: ubuntu-24.04
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Detect files
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: detect-project
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Block runtime dependency vulnerabilities
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        run: npm audit --omit=dev --audit-level=high

      # Development tooling is not shipped with the project. Keep advisories visible
      # while Dependabot prepares updates, without blocking a runtime-safe release.
      - name: Report development dependency vulnerabilities
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --debug --only-verified
