name: Security Scan

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-project:
    name: Detect Project Type
    runs-on: ubuntu-24.04
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect files
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: detect-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Block runtime dependency vulnerabilities
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        run: npm audit --omit=dev --audit-level=high

      # Development tooling is not shipped with the project. Keep advisories visible
      # while Dependabot prepares updates, without blocking a runtime-safe release.
      - name: Report development dependency vulnerabilities
        if: ${{ needs.detect-project.outputs.has_node == 'true' }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --debug --only-verified
