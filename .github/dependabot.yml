version: 2
updates:
  # npm 의존성 자동 업데이트 (Husky, commitlint 등)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      npm-compatible:
        update-types: ["minor", "patch"]

  # GitHub Actions 버전 자동 업데이트
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      actions-updates:
        patterns: ["*"]
